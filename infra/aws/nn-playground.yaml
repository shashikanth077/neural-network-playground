AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Neural Network Playground on one EC2 instance. Creates a security group and an
  instance that clones this repository and runs it with Docker Compose.
  The stack reports CREATE_COMPLETE only after the app answers /api/health.

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair, used only if you want SSH access.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: t3.small (2 GiB RAM) is the smallest size that builds comfortably.

  AllowedAppCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: Who may open the web app on port 8080. Use your own IP/32 to keep it private.

  AllowedSshCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    Description: Who may open SSH on port 22. Set this to your own IP/32.

  RepoUrl:
    Type: String
    Default: https://github.com/shashikanth077/neural-network-playground.git
    Description: Git URL of the repository to deploy. Must be publicly cloneable.

  RepoBranch:
    Type: String
    Default: claude/sharp-planck-u964bu
    Description: Branch or tag to deploy.

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI, resolved from the public SSM parameter.

Resources:
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Neural Network Playground - SSH and web app
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref AllowedAppCidr
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-sg"

  AppInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT30M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds:
        - !GetAtt AppSecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 16
            VolumeType: gp3
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-app"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          exec > >(tee /var/log/nn-playground-setup.log) 2>&1
          trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource AppInstance --region ${AWS::Region}' ERR

          # Docker and the Compose v2 plugin
          dnf install -y docker git
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # 2 GiB swap so the frontend build cannot exhaust memory
          if ! swapon --show | grep -q /swapfile; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
          fi

          # Application
          git clone --depth 1 --branch "${RepoBranch}" "${RepoUrl}" /opt/nn-playground
          cd /opt/nn-playground
          docker compose up -d --build

          # Wait until the API answers through nginx, then report success to CloudFormation
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/api/health > /dev/null; then break; fi
            sleep 5
          done
          curl -fs http://localhost:8080/api/health > /dev/null

          /opt/aws/bin/cfn-signal -e 0 --stack ${AWS::StackName} --resource AppInstance --region ${AWS::Region}

Outputs:
  InstanceId:
    Description: EC2 instance ID
    Value: !Ref AppInstance

  PublicIp:
    Description: Public IPv4 address of the server
    Value: !GetAtt AppInstance.PublicIp

  AppUrl:
    Description: Open this in your browser
    Value: !Sub "http://${AppInstance.PublicIp}:8080"

  HealthUrl:
    Description: Health check endpoint
    Value: !Sub "http://${AppInstance.PublicIp}:8080/api/health"

  SshCommand:
    Description: SSH command (requires the key pair you selected)
    Value: !Sub "ssh -i <your-key>.pem ec2-user@${AppInstance.PublicIp}"
