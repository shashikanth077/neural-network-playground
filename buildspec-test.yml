version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
      nodejs: 22
    commands:
      - pip install -r "$CODEBUILD_SRC_DIR/backend/requirements-dev.txt"
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm ci
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/backend" && pytest -q
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm run typecheck
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm test
      - cd "$CODEBUILD_SRC_DIR/frontend" && npm run build
