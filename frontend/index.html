<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn how neural networks work by training real ones in your browser. Interactive, visual and mathematically honest." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Neural Network Playground</title>
    <script>
      try {
        var t = localStorage.getItem("nnp-theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
